<title>Four Seasons 명단 설정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #f3f4f1;
    --surface: #ffffff;
    --surface-2: #e9ebe5;
    --line: #d3d7cf;
    --ink: #18201c;
    --ink-2: #566058;
    --ink-3: #8a938c;
    --court1: #1f5fa8;
    --court1-soft: #e3ecf8;
    --ball: #d6e800;
    --ball-ink: #2a3000;
    --focus: #1f5fa8;
    --shadow: 0 6px 20px rgba(24, 32, 28, .10);
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161a; --surface: #182026; --surface-2: #202a31; --line: #2c3840;
      --ink: #eef1ec; --ink-2: #aab3ab; --ink-3: #74807a;
      --court1: #6ea3e6; --court1-soft: #1b2d44; --focus: #6ea3e6;
      --shadow: 0 6px 20px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161a; --surface: #182026; --surface-2: #202a31; --line: #2c3840;
    --ink: #eef1ec; --ink-2: #aab3ab; --ink-3: #74807a;
    --court1: #6ea3e6; --court1-soft: #1b2d44; --focus: #6ea3e6;
    --shadow: 0 6px 20px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 56px; display: grid; gap: 22px; }

  .eyebrow {
    font-family: var(--display); font-weight: 600; font-size: 14px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  }
  h1 {
    margin: 2px 0 0; font-family: var(--display); font-weight: 700;
    font-size: 40px; line-height: 1; letter-spacing: -.01em; text-wrap: balance;
  }
  .meta { color: var(--ink-2); font-size: 13px; margin-top: 6px; }

  .label {
    font-family: var(--display); font-weight: 600; font-size: 15px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px;
  }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .fields { display: grid; gap: 10px; }
  .field { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; }
  .field .no {
    font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--ink-3);
    text-align: center; font-variant-numeric: tabular-nums;
  }
  input[type="text"], input[type="url"] {
    width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input::placeholder { color: var(--ink-3); }
  .hint { font-size: 12px; color: var(--ink-2); margin: 6px 0 0; }

  .build {
    width: 100%; border: 0; border-radius: 12px; padding: 14px;
    background: var(--ball); color: var(--ball-ink);
    font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em;
  }
  .build:active { transform: scale(.99); }

  .result { display: none; background: var(--court1-soft); border-color: transparent; }
  .result.show { display: grid; gap: 12px; }
  .result h2 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; }
  .url {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.5;
    overflow-wrap: anywhere; background: var(--surface); border-radius: 8px; padding: 10px 12px;
    color: var(--ink-2); max-height: 120px; overflow: auto;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 10px 14px; font-weight: 500; text-decoration: none; color: var(--ink); flex: 1; text-align: center;
  }
  .btn.primary { background: var(--court1); color: #fff; border-color: var(--court1); }
  .error { color: #b3261e; font-size: 13px; margin: 0; }
  :root[data-theme="dark"] .error { color: #ff8a80; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: 14px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Four Seasons Tennis</div>
    <h1>명단 설정</h1>
    <div class="meta">클럽원 5명과 게스트 5명을 입력하고 생성을 누르면 대진표 링크가 만들어집니다.</div>
  </header>

  <form id="form" class="wrap" style="padding:0;gap:18px" novalidate>
    <section>
      <p class="label">클럽원</p>
      <div class="card fields" id="members"></div>
      <p class="hint">기본 클럽원 명단이 채워져 있습니다. 못 나오는 분이 있으면 그 칸을 다른 이름으로 바꾸세요. 수정한 명단은 이 기기에 기억됩니다.</p>
    </section>

    <section>
      <p class="label">게스트</p>
      <div class="card fields" id="guests"></div>
    </section>

    <section>
      <p class="label">대진표 주소</p>
      <div class="card">
        <input type="url" id="base" inputmode="url" autocomplete="off" spellcheck="false">
        <p class="hint">대진표 페이지(index.html)가 올라가 있는 주소입니다. 같은 폴더에 있으면 그대로 두세요.</p>
      </div>
    </section>

    <p class="error" id="error" hidden></p>
    <button class="build" type="submit">생성</button>
  </form>

  <section class="card result" id="result">
    <h2>대진표 링크</h2>
    <div class="url" id="url"></div>
    <div class="actions">
      <button class="btn" type="button" id="copy">링크 복사</button>
      <a class="btn primary" id="open" href="#" target="_blank" rel="noopener">대진표 열기</a>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  const N = 5;
  const STORE = 'fs-setup';
  const CLUB_MEMBERS = ['권순범', '김일두', '손원식', '정성진', '조진희'];

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  let saved = {};
  try { saved = JSON.parse(safeGet(STORE)) || {}; } catch (e) {}

  function fieldsHtml(prefix, values, ph) {
    return Array.from({ length: N }, (_, i) => `
      <label class="field">
        <span class="no">${i + 1}</span>
        <input type="text" name="${prefix}${i}" value="${esc(values[i] || '')}" placeholder="${ph} ${i + 1}" maxlength="12" autocomplete="off">
      </label>`).join('');
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  document.getElementById('members').innerHTML = fieldsHtml('m', saved.m || CLUB_MEMBERS, '클럽원');
  document.getElementById('guests').innerHTML = fieldsHtml('g', saved.g || [], '게스트');
  document.getElementById('base').value = saved.base || new URL('index.html', location.href).href;

  function readList(prefix) {
    const fd = new FormData(document.getElementById('form'));
    return Array.from({ length: N }, (_, i) => (fd.get(prefix + i) || '').trim());
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const m = readList('m'), g = readList('g');
    const base = document.getElementById('base').value.trim();
    const err = document.getElementById('error');

    const missing = [];
    m.forEach((v, i) => { if (!v) missing.push(`클럽원 ${i + 1}`); });
    g.forEach((v, i) => { if (!v) missing.push(`게스트 ${i + 1}`); });
    if (missing.length) {
      err.textContent = `이름이 비어 있습니다: ${missing.join(', ')}`;
      err.hidden = false;
      document.getElementById('result').classList.remove('show');
      return;
    }
    if ([...m, ...g].some(v => v.includes(','))) {
      err.textContent = '이름에는 쉼표(,)를 쓸 수 없습니다.';
      err.hidden = false;
      return;
    }
    err.hidden = true;

    safeSet(STORE, JSON.stringify({ m, g, base }));

    let url;
    try {
      url = new URL(base);
    } catch (e2) {
      err.textContent = '대진표 주소가 올바른 URL이 아닙니다.';
      err.hidden = false;
      return;
    }
    url.searchParams.set('m', m.join(','));
    url.searchParams.set('g', g.join(','));
    const link = url.href;

    document.getElementById('url').textContent = link;
    document.getElementById('open').href = link;
    document.getElementById('result').classList.add('show');
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('copy').addEventListener('click', async () => {
    const link = document.getElementById('url').textContent;
    try {
      await navigator.clipboard.writeText(link);
      toast('링크를 복사했습니다');
    } catch (e) {
      prompt('이 주소를 복사해 공유하세요', link);
    }
  });

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
</script>
